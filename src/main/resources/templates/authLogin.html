<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi</title>
    <link rel="stylesheet" th:href="@{/css/authpage.css}">
</head>

<body>
    <nav>

    </nav>
    <main>
        <div class="auth-container">
            <form th:action="@{/login}" method="POST">
                <h1 class="brand-title">Pugliamare</h1>
                <p class="subtitle">Bentornato. Accedi per continuare.</p>

                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="username" placeholder="tuo@indirizzo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="password" required>
                </div>

                <div class="forgot-password-container">
                    <a href="#" class="forgot-password">Password dimenticata?</a>
                </div>

                <button type="submit" class="btn-primary">Accedi &rarr;</button>

                <div class="divider">
                    <span>oppure</span>
                </div>

                <a th:href="@{/register}" class="btn-secondary">Registrati</a>
            </form>
        </div>

    </main>
    <footer>

    </footer>
</body>

</html>
