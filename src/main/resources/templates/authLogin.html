<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pugliamare - Accedi</title>

    <link rel="stylesheet" th:href="@{/css/authpage.css}">
    <script th:src="@{/js/authpage.js}" defer></script>
</head>
<body>
    <header>
        <nav>
            <!-- Navbar coerente con la registrazione -->
        </nav>
    </header>
    
    <main class="main-auth">

        <div class="auth-container">
            <!-- th:action punta al login di Spring Security -->
            <form th:action="@{/login}" method="POST">
                
                <h1 class="brand-title">Pugliamare</h1>
                <p class="subtitle">Bentornato! Accedi per continuare.</p>

                <!-- Box di errore opzionale nel caso in cui le credenziali siano errate -->
                <div th:if="${param.error}" style="color: #b91c1c; background-color: #fef2f2; border: 1px solid #fee2e2; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; margin-bottom: 15px; font-weight: bold;">
                    Email o password errate.
                </div>

                <!-- Campo Email / Username -->
                <div class="form-group">
                    <label for="username">Email</label>
                    <!-- Nota: Spring Security di default si aspetta 'username', quindi usiamo id/name="username" di tipo email -->
                    <input type="email" id="username" name="username" placeholder="&#9993; Inserisci l'email" required>
                </div>

                <!-- Campo Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="&#x1F512;&#xFE0E; Inserisci password" required>
                </div>

                <!-- Pulsante di Login -->
                <button type="submit" class="btn-primary">Accedi &rarr;</button>

                <!-- Link alternativo per andare alla registrazione -->
                <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #64748b;">
                    Non hai ancora un account? 
                    <a th:href="@{/register}" style="color: #0369a1; font-weight: bold; text-decoration: none; margin-left: 5px;">Registrati</a>
                </div>

            </form>
        </div>

    </main>

    <footer>
        <!-- Footer coerente con la registrazione -->
    </footer>
</body>
</html>
